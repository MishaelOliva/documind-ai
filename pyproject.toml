[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "documind-ai"
version = "1.0.0"
description = "Document QA and semantic search platform using FastAPI, dense vector embeddings, and source-grounded synthesis."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Mishael Oliva", email = "mishael.oliva2002@gmail.com"}
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "data"
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402"]

